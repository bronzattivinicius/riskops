id: baf_foreign_request
name: Foreign-origin request
version: 1
status: active
description: 'Flags applications originating from a country different from the bank''s.
  Written on the intuitive assumption that cross-border requests are riskier; never
  validated against historical data. Measured fraud rate: 2.20% (n=25,242).'
logic:
  logic: and
  conditions:
  - field: foreign_request
    operator: eq
    value: 1
