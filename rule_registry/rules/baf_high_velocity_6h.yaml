id: baf_high_velocity_6h
name: High application velocity in the last 6 hours
version: 1
status: active
description: 'Flags applications made during a burst of application activity in the
  last 6 hours. Written on the intuitive assumption that high velocity indicates automated
  or bot-driven fraud; never validated against historical data. Measured fraud rate:
  0.99% (n=540,693) -- *below* the 1.10% dataset baseline, i.e. this condition is
  actively counterproductive.'
logic:
  logic: and
  conditions:
  - field: velocity_6h
    operator: gt
    value: 5000
tags:
- baf
- seed
- legacy
