id: baf_device_email_reuse
name: Device reused across multiple recent emails
version: 1
status: candidate
description: Flags applications from a device that has been associated with two or
  more distinct emails in the last 8 weeks. Measured 4.09% fraud rate (n=25,302 on
  Base.csv).
logic:
  logic: and
  conditions:
  - field: device_distinct_emails_8w
    operator: gte
    value: 2
tags:
- baf
- candidate
- device
