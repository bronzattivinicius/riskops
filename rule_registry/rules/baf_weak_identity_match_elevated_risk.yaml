id: baf_weak_identity_match_elevated_risk
name: Weak name/email match with elevated risk score
version: 1
status: candidate
description: Flags applications where the applicant's name barely resembles their
  email address, combined with a moderately elevated risk score. Measured 4.87% fraud
  rate (n=31,210 on Base.csv).
logic:
  logic: and
  conditions:
  - field: name_email_similarity
    operator: lt
    value: 0.2
  - field: credit_risk_score
    operator: gt
    value: 200
tags:
- baf
- candidate
- identity
