id: baf_free_email_domain
name: Free email domain
version: 2
status: active
description: 'Flags applications made with a free email domain. Written on the intuitive
  assumption that free email domains are less trustworthy than paid ones; never validated
  against historical data. Measured fraud rate: 1.38% (n=529,886), barely above the
  1.10% dataset baseline despite matching over half of all rows.'
logic:
  logic: and
  conditions:
  - field: email_is_free
    operator: eq
    value: 1
tags:
- baf
- seed
- legacy
